name: Voice catalog decks
on: workflow_dispatch
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install piper-tts
      - name: Download Piper voice
        run: |
          mkdir -p voices
          curl -sSL -o voices/en_US-lessac-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
          curl -sSL -o voices/en_US-lessac-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
      - run: corepack enable pnpm && pnpm install --frozen-lockfile
      - run: npx tsx scripts/voice-decks.ts
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_TG_ID: ${{ secrets.ADMIN_TG_ID }}
          PIPER_MODEL: voices/en_US-lessac-medium.onnx
      - run: npx tsx scripts/csv-to-sql.ts
      - name: Commit voiced decks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/decks migrations/0002_seed_catalog.sql
          git diff --cached --quiet || git commit -m "chore: voice catalog decks"
          git push
