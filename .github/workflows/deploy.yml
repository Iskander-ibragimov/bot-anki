name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable pnpm && pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Ensure workers.dev subdomain
        run: |
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            SUB="povtor-$(echo $CLOUDFLARE_ACCOUNT_ID | cut -c1-8)"
            curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"subdomain\":\"$SUB\"}" $API | jq -c '.success, .errors'
          fi
          echo "workers.dev subdomain: $SUB"

      - name: Ensure D1 database
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="povtor") | .uuid')
          if [ -z "$ID" ]; then
            npx wrangler d1 create povtor
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="povtor") | .uuid')
          fi
          test -n "$ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          echo "D1: $ID"

      - run: npx wrangler d1 migrations apply povtor --remote
      - run: npx tsx scripts/csv-to-sql.ts
      - run: npx wrangler d1 execute povtor --remote --file seed/catalog.sql --yes

      - name: Deploy worker
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Set worker secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ADMIN_TG_ID: ${{ secrets.ADMIN_TG_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          PROVIDERS=$(npx tsx scripts/pick-models.ts)
          jq -n --arg b "$BOT_TOKEN" --arg w "$WEBHOOK_SECRET" --arg a "$ADMIN_TG_ID" --arg p "$PROVIDERS" \
            '{BOT_TOKEN:$b, WEBHOOK_SECRET:$w, ADMIN_TG_ID:$a, LLM_PROVIDERS:$p}' > secrets.json
          npx wrangler secret bulk secrets.json
          rm secrets.json

      - name: Register Telegram webhook and commands
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do curl -sf "$WORKER_URL/" && break; sleep 10; done
          npx tsx scripts/set-webhook.ts
          curl -s "https://api.telegram.org/bot$BOT_TOKEN/getWebhookInfo" | jq '.result | {url, pending_update_count, last_error_message}'
